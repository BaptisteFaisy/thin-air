name: ci-budget (≤ 5 min)

# Toute CI rend son verdict en 5 min au plus, et la règle est contrôlée,
# pas espérée : `scripts/check-budget.mjs` relit tous les workflows et échoue
# si un job de PR dépasse 5 minutes, si un job n'écrit pas son budget, ou si
# un job de PR est tolérant à l'échec.
# Ce workflow est un garde-fou de configuration, pas un test applicatif :
# il échoue si un job déclare plus de 5 minutes (ou aucun timeout).
# Il tourne sur chaque PR pour que le check `ci-budget` existe toujours
# (condition de file Mergify) — coût : quelques secondes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-budget:
    name: ci-budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Runner auto-hébergé : node vit dans l'espace utilisateur.
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Vérifier le budget de 5 min par job
        run: node scripts/check-budget.mjs