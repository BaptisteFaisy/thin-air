name: deploy

# Publication du site (AIR-N-13 : HTTPS, gratuit, en ligne jusqu'au
# 29 janvier 2027 au moins). GitHub Pages est retenu parce qu'il ne demande ni
# compte tiers ni carte : le dépôt est public, la page suit le dépôt.
#
# Hors PR, comme `build.yml` : la règle du projet est un verdict en 5 min sur
# les PR, et une publication ne prouve rien sur une PR.
#
# Deux contrôles avant de publier, les mêmes que `build.yml` :
#   AIR-N-01  aucune requête vers une origine tierce dans le bundle construit ;
#   AIR-F-25  aucun fichier sonore publié.
# Le modèle de vision et ses fichiers d'exécution sont téléchargés puis copiés
# par `npm run fetch-model` : ils sont servis par le site lui-même, jamais par
# un tiers, et ne sont pas versionnés (7,8 Mo).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: [self-hosted, linux, x64, thin-air-worker]
    timeout-minutes: 5
    env:
      PATH: /home/baptiste/bin:/usr/local/bin:/usr/bin:/bin
      # Playwright est une dépendance de développement pour les preuves de bout
      # en bout, qui tournent sur le poste et non dans la CI des PR : sans cet
      # arrêt, `npm ci` télécharge les navigateurs et le budget de 5 min saute.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Nettoyage du workspace (node_modules et public/models conservés)
        # Les dossiers de runner sont exclus explicitement (docs/runners.md).
        run: git clean -ffdx -e node_modules -e public/models -e 'actions-runner-*' -e '_work*'

      - name: Dépendances
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Modèle de vision et fichiers d'exécution (servis par le site)
        run: npm run fetch-model

      - name: Build du site
        run: npm run build

      - name: AIR-N-01 et AIR-F-25 — bundle contrôlé avant publication
        run: node scripts/check-dist.mjs

      - name: Fichiers publiés
        run: find apps/web/dist -type f

      - name: Préparer l'artefact Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      # Le bundle construit, mis de côté pour la vérification d'après coup :
      # `verifier-publication` le télécharge et compare son SHA-256 à celui
      # que le site public sert (incident du bundle de 9 Kio servi des heures).
      - name: Bundle construit (vérification après publication)
        uses: actions/upload-artifact@v4
        with:
          name: bundle-publie
          path: |
            apps/web/dist/index.html
            apps/web/dist/assets
          retention-days: 1

  deploy:
    name: deploy
    needs: build
    runs-on: [self-hosted, linux, x64, thin-air-worker]
    timeout-minutes: 5
    outputs:
      url: ${{ steps.publication.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # 3. Vérification APRÈS publication : le site public sert-il exactement le
  #    bundle construit ? (la publication est un effet de bord, pas un espoir.)
  # ---------------------------------------------------------------------------
  verifier-publication:
    name: verifier-publication
    needs: [build, deploy]
    runs-on: [self-hosted, linux, x64, thin-air-worker]
    timeout-minutes: 5
    env:
      PATH: /home/baptiste/bin:/usr/local/bin:/usr/bin:/bin
      PULSE_AUDIO: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      # Le bundle construit par le job `build`, téléchargé tel quel : aucun
      # rebuild, on compare les octets réellement publiés.
      - name: Bundle construit (publié par le job build)
        uses: actions/download-artifact@v4
        with:
          name: bundle-publie
          path: apps/web/dist

      # La publication peut mettre quelques secondes à se propager : on laisse
      # à l'hébergeur le temps de servir le nouveau bundle, puis on tranche.
      - name: Le site public sert-il exactement le bundle construit ?
        run: |
          set -uo pipefail
          for essai in 1 2 3 4 5 6; do
            if node scripts/check-deployed.mjs --url "${{ needs.deploy.outputs.url }}"; then
              echo "publication vérifiée (essai $essai) : le site public sert le bundle construit"
              exit 0
            fi
            echo "::notice::le site public ne sert pas encore le bundle construit (essai $essai/6)"
            sleep 20
          done
          echo "::error::publication non vérifiée : le site public ne sert pas le bundle construit"
          exit 1
