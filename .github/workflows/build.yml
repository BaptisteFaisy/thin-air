name: build

# Build du site et E2E navigateur — HORS PR, volontairement.
#
# La règle du projet est un verdict en 5 min par job sur les PR (règle user,
# ~/Bureau/CI-BUDGET-5MIN.md, `scripts/check-budget.mjs`) : le build
# du site et l'E2E navigateur n'ont rien à y faire, ils allongeraient le chemin
# critique de chaque PR sans rien prouver de plus qu'un typecheck et des
# propriétés. Ils tournent donc sur `main` seulement, et à la demande.
#
#   AIR-N-10  aucune caméra réelle dans les tests ; l'E2E est facultatif et
#             tolérant à l'absence de navigateur.
#   AIR-N-02  aucun son : pas de périphérique audio, tout est rendu hors ligne.
#   AIR-N-01  aucune requête vers une origine tierce : c'est justement ce que
#             le job `build` contrôle sur le bundle construit.
#
# Déclencheurs : `push` sur `main` et `workflow_dispatch`. JAMAIS `pull_request`,
# pour ne pas se glisser dans la file de merge, et jamais le motif interdit que
# le garde `couche0` refuse.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul build à la fois sur `main` : un push plus récent annule le précédent.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Construire le site, puis le contrôler : origine unique, aucun sonore.
  # ---------------------------------------------------------------------------
  build:
    name: build
    runs-on: [self-hosted, linux, x64, thin-air-worker]
    # Budget : 5 min. Build statique d'une page React + copie du modèle.
    timeout-minutes: 5
    env:
      # Runner auto-hébergé : node/npm vivent en espace utilisateur.
      PATH: /home/baptiste/bin:/usr/local/bin:/usr/bin:/bin
      # Playwright est une dépendance de développement pour les preuves de bout
      # en bout, qui tournent sur le poste et non dans la CI des PR : sans cet
      # arrêt, `npm ci` télécharge les navigateurs et le budget de 5 min saute.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Aucune sortie audio sur le runner, même si rien ici n'en ouvre une.
      PULSE_AUDIO: 0
    steps:
      - uses: actions/checkout@v4
        with:
          # Rien à voir avec l'historique : un seul commit suffit.
          fetch-depth: 1
          # Le job n'écrit pas dans le dépôt : aucun jeton laissé dans .git.
          persist-credentials: false
          clean: false

      # Runners persistants : un reste de run précédent fausserait le contrôle
      # des fichiers sonores. `node_modules` est conservé (régénéré juste après).
      - name: Nettoyage du workspace
        # Les dossiers de runner sont exclus explicitement (docs/runners.md).
        run: git clean -ffdx -e node_modules -e 'actions-runner-*' -e '_work*'

      - name: Dépendances (npm ci, hors ligne au maximum)
        run: npm ci --prefer-offline --no-audit --no-fund

      # Le modèle est téléchargé par le script du dépôt (seule requête réseau
      # autorisée, AIR-N-01 §11.9) : le site le sert ensuite lui-même.
      - name: Modèle de vision (servi par le site, jamais par un tiers)
        run: npm run fetch-model

      - name: Build du site (vite)
        run: npm run build

      # Contrôles (a) et (b) : aucune origine tierce (AIR-N-01) et aucun
      # fichier sonore (AIR-F-25). Une seule implémentation, partagée avec
      # `deploy.yml` : `scripts/check-dist.mjs`.
      - name: Contrôle du site construit
        run: node scripts/check-dist.mjs

      - name: Constat — le modèle est-il dans le dossier publié ?
        run: |
          set -euo pipefail
          if [ -d apps/web/dist/models ]; then
            du -sh apps/web/dist/models
            ls -l apps/web/dist/models
            echo "modèle présent dans dist : il sera servi par le site (§11.9)"
          else
            echo "::warning::apps/web/dist/models absent — vérifier le publicDir de Vite (apps/web/public) et la cible de scripts/fetch-model.mjs (public/models)"
          fi

      - name: Trace des poids (à reporter dans docs/latency.md)
        run: du -sh apps/web/dist apps/web/dist/assets apps/web/dist/models 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # 2. E2E navigateur — clairement NON REQUIS, et tolérant à l'absence d'outil.
  #    Aucune dépendance n'est ajoutée au dépôt : si le navigateur ou Playwright
  #    n'est pas là, le job le dit et s'arrête proprement.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e
    runs-on: [self-hosted, linux, x64, thin-air-worker]
    needs: build
    timeout-minutes: 5
    # Facultatif de bout en bout : ni requis sur la PR, ni bloquant sur `main`.
    continue-on-error: true
    env:
      PATH: /home/baptiste/bin:/usr/local/bin:/usr/bin:/bin
      PULSE_AUDIO: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Nettoyage du workspace
        # Les dossiers de runner sont exclus explicitement (docs/runners.md).
        run: git clean -ffdx -e node_modules -e 'actions-runner-*' -e '_work*'

      - name: Dépendances
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Playwright est-il là ? (sinon on s'arrête, sans rien installer)
        id: sonde
        run: |
          set -euo pipefail
          if npx --no-install playwright --version >/dev/null 2>&1; then
            echo "present=1" >> "$GITHUB_OUTPUT"
            npx --no-install playwright --version
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "Playwright absent : E2E sauté (le dépôt n'ajoute aucune dépendance pour lui)."
          fi

      # Inutile de construire si aucun navigateur ne pourra ouvrir la page.
      - name: Modèle et build
        if: steps.sonde.outputs.present == '1'
        run: |
          npm run fetch-model
          npm run build

      # Le navigateur de test est lancé sans écran et avec le son coupé
      # (AIR-N-02, AIR-N-10). Aucune caméra réelle : l'E2E de référence utilise
      # un fichier vidéo en guise de caméra.
      - name: E2E — page servie, caméra factice, son coupé
        if: steps.sonde.outputs.present == '1'
        env:
          QUIET_AUDIO: "1"
        run: |
          set -euo pipefail
          echo "::notice::E2E non requis : son absence de rouge n'invalide aucun lot."
          npx --no-install playwright test --reporter=dot

      - name: Rien à faire (pas d'outil E2E)
        if: steps.sonde.outputs.present != '1'
        run: |
          echo "::notice::E2E sauté : Playwright n'est pas installé sur ce runner."
          echo "Le job est facultatif (continue-on-error) et n'ajoute aucune dépendance."

  # ---------------------------------------------------------------------------
  # 3. Preuves d'accessibilité et de réseau — BLOQUANT (AIR-N-06, §12.4).
  #    Construit le site, lance les specs Playwright (E2E, journal réseau,
  #    axe-core sur les huit écrans du §12.1), et publie les preuves brutes en
  #    artefacts. Aucune tolérance : la moindre violation critique ou sérieuse,
  #    ou le moindre test rouge, colore le job en rouge.
  #    Le navigateur doit déjà être en cache sur le runner (~/.cache/ms-playwright) :
  #    le dépôt n'installe rien (PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD), et Chromium
  #    absent = échec net avec un message clair, jamais un faux vert.
  # ---------------------------------------------------------------------------
  preuves:
    name: preuves
    runs-on: [self-hosted, linux, x64, thin-air-worker]
    # Après `e2e` (lui-même après `build`) : un seul runner, un seul port 4173.
    needs: e2e
    timeout-minutes: 5
    continue-on-error: false
    env:
      PATH: /home/baptiste/bin:/usr/local/bin:/usr/bin:/bin
      # Aucun navigateur téléchargé pendant npm ci : le cache du runner suffit.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Aucune sortie audio sur le runner, même si les specs tournent muettes.
      PULSE_AUDIO: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Nettoyage du workspace
        # Les dossiers de runner sont exclus explicitement (docs/runners.md).
        run: git clean -ffdx -e node_modules -e 'actions-runner-*' -e '_work*'

      - name: Dépendances (npm ci, sans téléchargement de navigateur)
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Chromium est en cache ? (absent = échec net, pas de faux vert)
        run: |
          set -euo pipefail
          shopt -s nullglob
          cache="$HOME/.cache/ms-playwright"
          trouves=( "$cache"/chromium_headless_shell-*/chrome-headless-shell-linux*/chrome-headless_shell \
                    "$cache"/chromium-*/chrome-linux*/chrome )
          if [ "${#trouves[@]}" -eq 0 ]; then
            echo "::error::Chromium absent du cache du runner ($cache)."
            echo "Ce job n'installe rien (AIR-N-01, PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1) :"
            echo "préparer le cache (npx playwright install chromium) puis relancer le workflow."
            exit 1
          fi
          printf 'Chromium en cache : %s\n' "${trouves[@]}"

      - name: Build du site (vite)
        run: npm run build

      # Specs de bout en bout : journal réseau (AIR-N-01), aucun son
      # (--mute-audio, AIR-N-02), axe-core sur les huit écrans du §12.4.
      # Le serveur de test reconstruit et sert le site lui-même (webServer).
      - name: Preuves Playwright — E2E, journal réseau, axe (son coupé)
        run: npx --no-install playwright test --config apps/web/playwright.config.ts --reporter=line

      - name: Publier le journal réseau (preuve AIR-N-01)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preuves-reseau
          path: |
            apps/web/out/e2e/reseau.json
            apps/web/out/e2e/camera.json
          if-no-files-found: error

      - name: Publier le rapport axe (preuve AIR-N-06)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preuves-axe
          path: apps/web/out/e2e/axe-*.json
          if-no-files-found: error
